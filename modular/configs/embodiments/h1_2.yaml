# Unitree H1-2, 27 DoF without hands. Joint names, order and effort limits from
# unitree_ros robots/h1_2_description/h1_2_handless.urdf. Default leg pose from
# unitree_rl_gym deploy config h1_2.yaml. IMU in the torso above torso_joint.

name: h1_2
joint_names: [left_hip_yaw_joint, left_hip_pitch_joint, left_hip_roll_joint, left_knee_joint, left_ankle_pitch_joint,
  left_ankle_roll_joint, right_hip_yaw_joint, right_hip_pitch_joint, right_hip_roll_joint, right_knee_joint, right_ankle_pitch_joint,
  right_ankle_roll_joint, torso_joint, left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint,
  left_elbow_joint, left_wrist_roll_joint, left_wrist_pitch_joint, left_wrist_yaw_joint, right_shoulder_pitch_joint,
  right_shoulder_roll_joint, right_shoulder_yaw_joint, right_elbow_joint, right_wrist_roll_joint, right_wrist_pitch_joint,
  right_wrist_yaw_joint]
control_dt: 0.02
estimator_joints: all
slots: {left_hip_yaw_joint: left_hip_yaw, left_hip_pitch_joint: left_hip_pitch, left_hip_roll_joint: left_hip_roll,
  left_knee_joint: left_knee, left_ankle_pitch_joint: left_ankle_pitch, left_ankle_roll_joint: left_ankle_roll,
  right_hip_yaw_joint: right_hip_yaw, right_hip_pitch_joint: right_hip_pitch, right_hip_roll_joint: right_hip_roll,
  right_knee_joint: right_knee, right_ankle_pitch_joint: right_ankle_pitch, right_ankle_roll_joint: right_ankle_roll,
  torso_joint: waist_yaw, left_shoulder_pitch_joint: left_shoulder_pitch, left_shoulder_roll_joint: left_shoulder_roll,
  left_shoulder_yaw_joint: left_shoulder_yaw, left_elbow_joint: left_elbow, left_wrist_roll_joint: left_wrist_roll,
  left_wrist_pitch_joint: left_wrist_pitch, left_wrist_yaw_joint: left_wrist_yaw, right_shoulder_pitch_joint: right_shoulder_pitch,
  right_shoulder_roll_joint: right_shoulder_roll, right_shoulder_yaw_joint: right_shoulder_yaw, right_elbow_joint: right_elbow,
  right_wrist_roll_joint: right_wrist_roll, right_wrist_pitch_joint: right_wrist_pitch, right_wrist_yaw_joint: right_wrist_yaw}
default_q: {default: 0.0, left_hip_pitch_joint: -0.16, right_hip_pitch_joint: -0.16, left_knee_joint: 0.36, right_knee_joint: 0.36,
  left_ankle_pitch_joint: -0.2, right_ankle_pitch_joint: -0.2}
effort_limit: {left_hip_yaw_joint: 200.0, left_hip_pitch_joint: 200.0, left_hip_roll_joint: 200.0, left_knee_joint: 300.0,
  left_ankle_pitch_joint: 60.0, left_ankle_roll_joint: 40.0, right_hip_yaw_joint: 200.0, right_hip_pitch_joint: 200.0,
  right_hip_roll_joint: 200.0, right_knee_joint: 300.0, right_ankle_pitch_joint: 60.0, right_ankle_roll_joint: 40.0,
  torso_joint: 200.0, left_shoulder_pitch_joint: 40.0, left_shoulder_roll_joint: 40.0, left_shoulder_yaw_joint: 18.0,
  left_elbow_joint: 18.0, left_wrist_roll_joint: 19.0, left_wrist_pitch_joint: 19.0, left_wrist_yaw_joint: 19.0,
  right_shoulder_pitch_joint: 40.0, right_shoulder_roll_joint: 40.0, right_shoulder_yaw_joint: 18.0, right_elbow_joint: 18.0,
  right_wrist_roll_joint: 19.0, right_wrist_pitch_joint: 19.0, right_wrist_yaw_joint: 19.0}
torque: {source: tau_est}
imu:
  frame: torso
  chain:
  - joint: torso_joint
    axis: [0.0, 0.0, 1.0]
groups:
  legs: [left_hip_yaw_joint, left_hip_pitch_joint, left_hip_roll_joint, left_knee_joint, left_ankle_pitch_joint,
    left_ankle_roll_joint, right_hip_yaw_joint, right_hip_pitch_joint, right_hip_roll_joint, right_knee_joint, right_ankle_pitch_joint,
    right_ankle_roll_joint]
  waist: [torso_joint]
  left_arm: [left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint, left_elbow_joint, left_wrist_roll_joint,
    left_wrist_pitch_joint, left_wrist_yaw_joint]
  right_arm: [right_shoulder_pitch_joint, right_shoulder_roll_joint, right_shoulder_yaw_joint, right_elbow_joint,
    right_wrist_roll_joint, right_wrist_pitch_joint, right_wrist_yaw_joint]
  arms: [left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint, left_elbow_joint, left_wrist_roll_joint,
    left_wrist_pitch_joint, left_wrist_yaw_joint, right_shoulder_pitch_joint, right_shoulder_roll_joint, right_shoulder_yaw_joint,
    right_elbow_joint, right_wrist_roll_joint, right_wrist_pitch_joint, right_wrist_yaw_joint]
  upper: [torso_joint, left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint, left_elbow_joint,
    left_wrist_roll_joint, left_wrist_pitch_joint, left_wrist_yaw_joint, right_shoulder_pitch_joint, right_shoulder_roll_joint,
    right_shoulder_yaw_joint, right_elbow_joint, right_wrist_roll_joint, right_wrist_pitch_joint, right_wrist_yaw_joint]
  body: [left_hip_yaw_joint, left_hip_pitch_joint, left_hip_roll_joint, left_knee_joint, left_ankle_pitch_joint,
    left_ankle_roll_joint, right_hip_yaw_joint, right_hip_pitch_joint, right_hip_roll_joint, right_knee_joint, right_ankle_pitch_joint,
    right_ankle_roll_joint, torso_joint, left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint,
    left_elbow_joint, left_wrist_roll_joint, left_wrist_pitch_joint, left_wrist_yaw_joint, right_shoulder_pitch_joint,
    right_shoulder_roll_joint, right_shoulder_yaw_joint, right_elbow_joint, right_wrist_roll_joint, right_wrist_pitch_joint,
    right_wrist_yaw_joint]
